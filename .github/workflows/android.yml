name: Android

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: riplow-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8
      BUILD_TOOLS: /usr/local/lib/android/sdk/build-tools/35.0.0

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android SDK packages
        shell: bash
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.30.5" \
            "ndk;27.0.12077973"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.7"

      - name: Build debug and release
        run: gradle assembleDebug assembleRelease --stacktrace --no-daemon

      - name: Verify APK outputs
        shell: bash
        run: |
          DEBUG_APK=app/build/outputs/apk/debug/app-debug.apk
          RELEASE_APK=app/build/outputs/apk/release/app-release-unsigned.apk

          test -s "$DEBUG_APK"
          test -s "$RELEASE_APK"

          echo "== File sizes =="
          ls -lh "$DEBUG_APK" "$RELEASE_APK"

          echo "== ZIP integrity: debug =="
          unzip -t "$DEBUG_APK" >/dev/null

          echo "== APK signature: debug =="
          "$BUILD_TOOLS/apksigner" verify --verbose "$DEBUG_APK"

          echo "== Package metadata: debug =="
          BADGING=$("$BUILD_TOOLS/aapt2" dump badging "$DEBUG_APK")
          printf '%s\n' "$BADGING" | grep -F "package: name='com.riplow.client'"

          echo "== Native library presence =="
          unzip -l "$DEBUG_APK" | grep -Eq 'lib/(arm64-v8a|armeabi-v7a|x86_64|x86)/libriplow_core\.so'

          echo "== Release APK ZIP integrity =="
          unzip -t "$RELEASE_APK" >/dev/null

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: riplow-apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error

      - name: Create v0.1.0 GitHub release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v0.1.0
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; leaving it unchanged."
            exit 0
          fi

          cp app/build/outputs/apk/debug/app-debug.apk "Riplow-Client-v0.1.0-debug.apk"

          gh release create "$RELEASE_TAG" \
            "Riplow-Client-v0.1.0-debug.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Riplow Client v0.1.0" \
            --notes "First test release. Includes the verified debug APK for Android/Bedrock client testing." \
            --latest
