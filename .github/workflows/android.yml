name: Android

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: riplow-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8
      BUILD_TOOLS: /usr/local/lib/android/sdk/build-tools/35.0.0

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android SDK packages
        shell: bash
        run: |
          sdkmanager --install             "platforms;android-35"             "build-tools;35.0.0"             "cmake;3.30.5"             "ndk;27.0.12077973"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.7"

      - name: Build debug and release
        run: gradle assembleDebug assembleRelease --stacktrace --no-daemon

      - name: Static module consistency checks
        shell: bash
        run: |
          KOTLIN_COUNT=$(grep -o 'ModuleDefinition("' app/src/main/java/com/riplow/client/modules/ModuleRegistry.kt | wc -l)
          NATIVE_COUNT=$(grep -o '{"[^"]*",' app/src/main/cpp/core/module.cpp | wc -l)

          echo "Kotlin module definitions: $KOTLIN_COUNT"
          echo "Native module definitions: $NATIVE_COUNT"

          test "$KOTLIN_COUNT" -gt 0
          test "$KOTLIN_COUNT" -eq "$NATIVE_COUNT"

          grep -F 'gameBridgeIds' app/src/main/java/com/riplow/client/modules/ModuleRegistry.kt
          grep -F 'Native core unavailable' app/src/main/java/com/riplow/client/NativeBridge.kt
          grep -F 'limit = 4' app/src/main/java/com/riplow/client/modules/ModuleManager.kt

      - name: Lint debug
        run: gradle :app:lintDebug --stacktrace --no-daemon

      - name: Verify APK outputs
        shell: bash
        run: |
          DEBUG_APK=app/build/outputs/apk/debug/app-debug.apk
          RELEASE_APK=app/build/outputs/apk/release/app-release-unsigned.apk

          test -s "$DEBUG_APK"
          test -s "$RELEASE_APK"

          echo "== File sizes =="
          ls -lh "$DEBUG_APK" "$RELEASE_APK"

          echo "== ZIP integrity: debug =="
          unzip -t "$DEBUG_APK" >/dev/null

          echo "== APK signature: debug =="
          "$BUILD_TOOLS/apksigner" verify --verbose "$DEBUG_APK"

          echo "== Package metadata: debug =="
          BADGING=$("$BUILD_TOOLS/aapt2" dump badging "$DEBUG_APK")
          printf '%s\n' "$BADGING" | grep -F "package: name='com.riplow.client'"

          echo "== Native library presence =="
          unzip -l "$DEBUG_APK" | grep -Eq 'lib/(arm64-v8a|armeabi-v7a|x86_64|x86)/libriplow_core\.so'

          echo "== Release APK ZIP integrity =="
          unzip -t "$RELEASE_APK" >/dev/null

          sha256sum "$DEBUG_APK" "$RELEASE_APK" | tee apk-sha256.txt

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: riplow-apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
            apk-sha256.txt
          if-no-files-found: error

      - name: Create versioned GitHub release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # Multiple main builds may run at once. Only the commit that is
          # currently at origin/main is allowed to publish a release.
          CURRENT_MAIN="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [ "$CURRENT_MAIN" != "$GITHUB_SHA" ]; then
            echo "Skipping release: this run is no longer the current main commit."
            exit 0
          fi

          APP_VERSION="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          RELEASE_TAG="v${APP_VERSION}"
          RELEASE_APK="Riplow-Client-${RELEASE_TAG}-debug.apk"
          RELEASE_SHA="Riplow-Client-${RELEASE_TAG}-sha256.txt"

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; leaving it unchanged."
            exit 0
          fi

          cp app/build/outputs/apk/debug/app-debug.apk "$RELEASE_APK"
          cp apk-sha256.txt "$RELEASE_SHA"

          gh release create "$RELEASE_TAG" "$RELEASE_APK" "$RELEASE_SHA"             --repo "$GITHUB_REPOSITORY"             --target "$GITHUB_SHA"             --title "Riplow Client $RELEASE_TAG"             --notes "Riplow $RELEASE_TAG: module hardening, fail-safe JNI, launcher reliability, and CI consistency checks."             --latest
