name: Android

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK
        shell: bash
        run: |
          if [ -n "${ANDROID_HOME:-}" ]; then
            echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
            echo "$ANDROID_HOME/cmdline-tools/16.0/bin" >> "$GITHUB_PATH"
          fi
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ] && [ -n "${ANDROID_HOME:-}" ] && [ -x "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager was not found on the hosted runner"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "cmake;3.30.5" "ndk;27.0.12077973"

      - name: Build debug and release
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: "8.7"
          arguments: assembleDebug assembleRelease

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: riplow-apks
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Create GitHub release
        if: startsWith(github.ref, "refs/tags/")
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: app/build/outputs/apk/release/app-release.apk
